name: Build Radxa Cubie A5E OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. FREE DISK SPACE
      # ============================================================

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

          echo "Available disk space:"
          df -h

      # ============================================================
      # 2. BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libyaml-dev \
            python3-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            quilt \
            cpio \
            bc \
            device-tree-compiler \
            fakeroot

      # ============================================================
      # 3. CHECK OUT PR #23296 DEVELOPMENT BRANCH
      # ============================================================

      - name: Checkout A527 OpenWrt branch
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: sunxi-a527-support
          fetch-depth: 1

      # ============================================================
      # 4. SHOW SOURCE REVISION
      # ============================================================

      - name: Show source revision
        run: |
          echo "OpenWrt revision:"
          git log -1 --oneline

          echo
          echo "Branch:"
          git branch --show-current

      # ============================================================
      # 5. UPDATE FEEDS
      # ============================================================

      - name: Update and install feeds
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 6. CREATE CUBIE A5E CONFIGURATION
      #
      # PR #23296 target:
      #
      #   sunxi
      #     cortexa55
      #       radxa_cubie-a5e
      #
      # U-BOOT IS NOT TOUCHED HERE.
      # ============================================================

      - name: Create Cubie A5E configuration
        run: |
          cat > .config <<'EOF'

          # ==========================================================
          # TARGET
          # ==========================================================

          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa55=y
          CONFIG_TARGET_sunxi_cortexa55_DEVICE_radxa_cubie-a5e=y

          # ==========================================================
          # IMAGE SIZE
          # ==========================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          # ==========================================================
          # LUCI
          # ==========================================================

          CONFIG_PACKAGE_luci=y

          # ==========================================================
          # VNSTAT
          # ==========================================================

          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_luci-app-vnstat2=y

          # ==========================================================
          # TERMINAL / FILE MANAGER
          # ==========================================================

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y

          # ==========================================================
          # BANDWIDTH MONITORING
          # ==========================================================

          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          # ==========================================================
          # WATCHDOG
          # ==========================================================

          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y

          # ==========================================================
          # SQM
          # ==========================================================

          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y

          # ==========================================================
          # ADGUARD HOME
          # ==========================================================

          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y

          # ==========================================================
          # DOCKER
          # ==========================================================

          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y

          CONFIG_KERNEL_CGROUPS=y

          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y

          # ==========================================================
          # FULL CONE NAT
          # ==========================================================

          CONFIG_PACKAGE_iptables-mod-fullconenat=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          CONFIG_PACKAGE_kmod-nft-fullconenat=y

          # ==========================================================
          # BBR
          # ==========================================================

          CONFIG_KERNEL_TCP_CONG_BBR=y

          # ==========================================================
          # IRQ BALANCING
          # ==========================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y

          # ==========================================================
          # 464XLAT / NAT46
          # ==========================================================

          CONFIG_PACKAGE_464xlat=y
          CONFIG_PACKAGE_kmod-nat46=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          # ==========================================================
          # VLAN / 802.1Q
          # ==========================================================

          CONFIG_PACKAGE_kmod-8021q=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-proto-vlan=y

          EOF

      # ============================================================
      # 7. CONFIGURE
      #
      # If this fails, GitHub Actions stops here.
      #
      # NOTHING AFTER THIS STEP WILL RUN.
      # ============================================================

      - name: Generate OpenWrt configuration
        run: |
          set -e

          echo "Running OpenWrt defconfig..."

          make defconfig

          echo
          echo "=========================================="
          echo "CONFIGURATION SUCCESSFUL"
          echo "=========================================="

      # ============================================================
      # 8. DOWNLOAD SOURCES
      # ============================================================

      - name: Download source files
        run: |
          set -e

          make download -j$(nproc)

      # ============================================================
      # 9. BUILD
      #
      # ONE BUILD ONLY.
      #
      # NO RETRY.
      # NO make -j1 fallback.
      # NO U-BOOT MODIFICATION.
      # ============================================================

      - name: Build OpenWrt
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING RADXA CUBIE A5E OPENWRT"
          echo "=========================================="

          echo "CPU threads: $(nproc)"
          echo

          make -j$(nproc)

      # ============================================================
      # 10. SHOW OUTPUT
      # ============================================================

      - name: Show generated files
        if: success()
        run: |
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

          find bin/targets -type f -print | sort

      # ============================================================
      # 11. PACKAGE ALL PACKAGE FEEDS
      # ============================================================

      - name: Package built packages
        if: success()
        run: |
          set -e

          rm -rf package-bundle
          mkdir -p package-bundle

          found=0

          while IFS= read -r pkgdir; do
            found=1

            name="$(echo "$pkgdir" | sed 's#/#_#g')"

            echo "Collecting:"
            echo "$pkgdir"

            mkdir -p "package-bundle/$name"
            cp -a "$pkgdir/." "package-bundle/$name/"

          done < <(find bin/targets -type d -name packages)

          if [ "$found" = "1" ]; then
            cd package-bundle
            zip -r ../all-packages.zip .
            cd ..

            echo
            echo "Package archive:"
            ls -lh all-packages.zip
          else
            echo "No package repositories found."
          fi

      # ============================================================
      # 12. UPLOAD FIRMWARE
      # ============================================================

      - name: Upload Cubie A5E OpenWrt images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt
          path: bin/targets/**
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 13. UPLOAD PACKAGES
      # ============================================================

      - name: Upload OpenWrt packages
        if: success() && hashFiles('all-packages.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_AllPackages
          path: all-packages.zip
          compression-level: 0
