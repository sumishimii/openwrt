name: Build Ultimate Radxa Cubie A5E OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libyaml-dev \
            python3-setuptools \
            python3-dev \
            rsync \
            swig \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            quilt \
            cpio \
            bc \
            device-tree-compiler \
            fakeroot

      - name: Checkout A527 OpenWrt
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: sunxi-a527-support
          fetch-depth: 1

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # CONFIGURATION
      # ============================================================

      - name: Create Cubie A5E configuration
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_armv82=y
          CONFIG_TARGET_sunxi_armv82_DEVICE_radxa_cubie-a5e=y

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          CONFIG_PACKAGE_luci=y

          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_luci-app-vnstat2=y

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y

          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y

          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y

          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y

          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y

          CONFIG_KERNEL_CGROUPS=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y

          CONFIG_PACKAGE_iptables-mod-fullconenat=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          CONFIG_PACKAGE_kmod-nft-fullconenat=y

          CONFIG_KERNEL_TCP_CONG_BBR=y

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y

          CONFIG_PACKAGE_464xlat=y
          CONFIG_PACKAGE_kmod-nat46=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          CONFIG_PACKAGE_kmod-8021q=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-proto-vlan=y
          EOF

      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Run OpenWrt defconfig
        run: |
          set -e

          echo "Running make defconfig..."

          if ! make defconfig; then
            echo ""
            echo "=============================================="
            echo "CONFIGURATION FAILED"
            echo "=============================================="
            echo ""
            echo "OpenWrt configuration failed."
            echo "BUILD WILL NOT CONTINUE."
            echo ""
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "DEFCONFIG SUCCESSFUL"
          echo "=============================================="

      # ============================================================
      # VALIDATE CONFIGURATION
      # ============================================================

      - name: Validate Cubie A5E configuration
        run: |
          set -e

          echo "Checking target..."

          grep -q '^CONFIG_TARGET_sunxi=y$' .config
          grep -q '^CONFIG_TARGET_sunxi_armv82=y$'
          grep -q '^CONFIG_TARGET_sunxi_armv82_DEVICE_radxa_cubie-a5e=y$'

          echo "Target configuration OK."

          echo ""
          echo "Checking U-Boot..."

          if grep -Eq '^CONFIG_PACKAGE_(u-boot|uboot-sunxi)=y$' .config; then
            echo ""
            echo "ERROR: U-Boot package is selected."
            echo "The build must NOT compile U-Boot."
            echo ""
            grep -E '^CONFIG_PACKAGE_(u-boot|uboot-sunxi)=y$' .config
            exit 1
          fi

          echo "No OpenWrt U-Boot package selected."

          echo ""
          echo "Checking rootfs size..."

          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=1024$' .config

          echo "Rootfs size OK."

          echo ""
          echo "=============================================="
          echo "CONFIGURATION VALID"
          echo "BUILD MAY CONTINUE"
          echo "=============================================="

      # ============================================================
      # ONLY AFTER CONFIGURATION PASSES
      # ============================================================

      - name: Download source files
        run: |
          set -e
          make download -j$(nproc)

      # ============================================================
      # BUILD
      # ============================================================

      - name: Compile OpenWrt
        run: |
          set -e

          echo "Starting OpenWrt compilation..."

          make -j$(nproc)

      # ============================================================
      # VERBOSE RETRY
      # ============================================================

      - name: Retry failed compilation verbosely
        if: failure()
        run: |
          echo "Parallel compilation failed."
          echo "Retrying compilation with verbose output..."

          make -j1 V=s

      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: List generated files
        if: success()
        run: |
          echo "=============================================="
          echo "BUILD OUTPUT"
          echo "=============================================="

          find bin/targets -type f -print | sort

      # ============================================================
      # PACKAGE REPOSITORIES
      # ============================================================

      - name: Package OpenWrt packages
        if: success()
        run: |
          set -e

          rm -rf package-bundle
          mkdir -p package-bundle

          found=0

          while IFS= read -r dir; do
            found=1

            name="$(echo "$dir" | tr '/' '_')"

            mkdir -p "package-bundle/$name"
            cp -a "$dir/." "package-bundle/$name/"

          done < <(find bin/targets -type d -name packages)

          if [ "$found" = "1" ]; then
            cd package-bundle
            zip -r ../all-packages.zip .
            cd ..
          else
            echo "No package repository found."
          fi

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload OpenWrt image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt
          path: bin/targets/**
          if-no-files-found: error
          compression-level: 0

      - name: Upload packages
        if: success() && hashFiles('all-packages.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_AllPackages
          path: all-packages.zip
          compression-level: 0
