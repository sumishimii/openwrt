name: Build Radxa Cubie A5E OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # FREE DISK SPACE
      # ============================================================

      - name: Free GitHub runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

          echo "Disk after cleanup:"
          df -h

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libyaml-dev \
            python3-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            quilt \
            cpio \
            bc \
            device-tree-compiler \
            fakeroot

      # ============================================================
      # CHECK OUT THE ACTUAL PR BRANCH
      # ============================================================

      - name: Checkout A527/T527 OpenWrt PR branch
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: sunxi-a527-support
          fetch-depth: 1

      # ============================================================
      # SHOW EXACT SOURCE VERSION
      # ============================================================

      - name: Show source revision
        run: |
          echo "============================================"
          echo "OpenWrt source"
          echo "============================================"

          git log -1 --oneline
          git status --short

          echo
          echo "Expected PR:"
          echo "https://github.com/openwrt/openwrt/pull/23296"

      # ============================================================
      # FEEDS
      # ============================================================

      - name: Update feeds
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # CREATE CONFIG
      #
      # IMPORTANT:
      # PR #23296 uses:
      #
      #   sunxi
      #     cortexa55
      #       radxa_cubie-a5e
      #
      # NOT armv82.
      # ============================================================

      - name: Create Cubie A5E configuration
        run: |
          set -e

          cat > .config <<'EOF'
          #
          # Radxa Cubie A5E
          # Allwinner A527 / Cortex-A55
          #

          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa55=y
          CONFIG_TARGET_sunxi_cortexa55_DEVICE_radxa_cubie-a5e=y

          #
          # Image storage
          #

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          #
          # LuCI
          #

          CONFIG_PACKAGE_luci=y

          #
          # vnStat
          #

          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_luci-app-vnstat2=y

          #
          # Terminal / file manager
          #

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y

          #
          # Network bandwidth monitoring
          #

          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          #
          # Watchdog
          #

          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y

          #
          # SQM
          #

          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y

          #
          # AdGuard Home
          #

          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y

          #
          # Docker
          #

          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y

          CONFIG_KERNEL_CGROUPS=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y

          #
          # Full-cone NAT
          #

          CONFIG_PACKAGE_iptables-mod-fullconenat=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          CONFIG_PACKAGE_kmod-nft-fullconenat=y

          #
          # BBR
          #

          CONFIG_KERNEL_TCP_CONG_BBR=y

          #
          # IRQ balancing
          #

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y

          #
          # IPv6 / 464XLAT
          #

          CONFIG_PACKAGE_464xlat=y
          CONFIG_PACKAGE_kmod-nat46=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          #
          # VLAN / 802.1Q
          #

          CONFIG_PACKAGE_kmod-8021q=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-proto-vlan=y

          EOF

      # ============================================================
      # CONFIGURE
      #
      # IF THIS FAILS, THE JOB STOPS HERE.
      # NOTHING BELOW THIS STEP RUNS.
      # ============================================================

      - name: Generate OpenWrt configuration
        run: |
          set -e

          echo "Running make defconfig..."

          make defconfig

          echo
          echo "Configuration generated successfully."

      # ============================================================
      # VERIFY THE ACTUAL PR TARGET
      #
      # These are the symbols that actually correspond to the
      # current PR branch.
      # ============================================================

      - name: Verify Cubie A5E target
        run: |
          set -e

          echo "============================================"
          echo "TARGET"
          echo "============================================"

          grep '^CONFIG_TARGET_sunxi=' .config
          grep '^CONFIG_TARGET_sunxi_cortexa55=' .config
          grep '^CONFIG_TARGET_sunxi_cortexa55_DEVICE_radxa_cubie-a5e=' .config

          echo
          echo "Cubie A5E target confirmed."

      # ============================================================
      # REMOVE ALL U-BOOT PACKAGES
      #
      # The PR contains many U-Boot variants.
      # We do not want ANY of them because the user already has
      # a working Cubie A5E U-Boot.
      #
      # Do this AFTER defconfig because the package defaults are
      # generated from the selected target/device.
      #
      # DO NOT run defconfig again afterwards.
      # ============================================================

      - name: Disable all OpenWrt U-Boot packages
        run: |
          set -e

          echo "U-Boot packages selected before removal:"
          grep '^CONFIG_PACKAGE_u-boot-' .config || true

          echo
          echo "Disabling every CONFIG_PACKAGE_u-boot-* option..."

          grep -E '^CONFIG_PACKAGE_u-boot-[^=]+=y$' .config \
            | cut -d= -f1 \
            | while read -r symbol; do
                echo "Disabling $symbol"
                ./scripts/config -d "$symbol"
              done

          echo
          echo "U-Boot packages after removal:"
          grep '^CONFIG_PACKAGE_u-boot-' .config || true

          echo
          echo "Checking..."

          if grep -Eq '^CONFIG_PACKAGE_u-boot-[^=]+=y$' .config; then
            echo "ERROR: A U-Boot package is still enabled."
            exit 1
          fi

          echo "OK: No U-Boot package will be built."

      # ============================================================
      # SAVE FINAL CONFIG FOR DEBUGGING
      # ============================================================

      - name: Show final important configuration
        run: |
          echo "============================================"
          echo "FINAL TARGET"
          echo "============================================"

          grep '^CONFIG_TARGET_' .config | head -30

          echo
          echo "============================================"
          echo "FINAL U-BOOT CONFIG"
          echo "============================================"

          grep -E 'CONFIG_PACKAGE_u-boot-|CONFIG_PACKAGE_trusted-firmware' .config || true

          echo
          echo "============================================"
          echo "FINAL ROOTFS CONFIG"
          echo "============================================"

          grep '^CONFIG_TARGET_.*PARTSIZE' .config || true

      # ============================================================
      # DOWNLOAD
      #
      # ONLY reached if configuration succeeded.
      # ============================================================

      - name: Download sources
        run: |
          set -e

          make download -j$(nproc)

      # ============================================================
      # BUILD
      #
      # ONE BUILD.
      # NO RETRY.
      # NO SECOND BUILD.
      # ============================================================

      - name: Build OpenWrt
        run: |
          set -e

          echo "============================================"
          echo "BUILDING RADXA CUBIE A5E OPENWRT"
          echo "============================================"

          make -j$(nproc)

      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: Show generated images
        if: success()
        run: |
          echo "============================================"
          echo "BUILD SUCCESS"
          echo "============================================"

          find bin/targets -type f -printf '%p\n' | sort

      # ============================================================
      # PACKAGE REPOSITORIES
      # ============================================================

      - name: Package OpenWrt package repositories
        if: success()
        run: |
          set -e

          rm -rf package-bundle
          mkdir -p package-bundle

          found=0

          while IFS= read -r pkgdir; do
            found=1

            name="$(echo "$pkgdir" | sed 's#/#_#g')"

            echo "Collecting: $pkgdir"

            mkdir -p "package-bundle/$name"
            cp -a "$pkgdir/." "package-bundle/$name/"

          done < <(find bin/targets -type d -name packages)

          if [ "$found" = "1" ]; then
            cd package-bundle
            zip -r ../all-packages.zip .
            cd ..

            ls -lh all-packages.zip
          else
            echo "No package repositories found."
          fi

      # ============================================================
      # UPLOAD FIRMWARE
      # ============================================================

      - name: Upload Cubie A5E OpenWrt images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt
          path: bin/targets/**
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # UPLOAD PACKAGES
      # ============================================================

      - name: Upload OpenWrt packages
        if: success() && hashFiles('all-packages.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_AllPackages
          path: all-packages.zip
          compression-level: 0
