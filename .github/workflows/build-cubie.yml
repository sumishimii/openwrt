name: Build Radxa Cubie A5E OpenWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up GitHub runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget quilt cpio

      - name: Checkout Developer PR Branch
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: sunxi-a527-support

      - name: Cache OpenWRT Toolchain
        uses: actions/cache@v4
        with:
          path: staging_dir/toolchain-*
          key: ${{ runner.os }}-openwrt-cortexa55-${{ hashFiles('target/linux/sunxi/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-cortexa55-

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Master Configuration Settings
        run: |
          # Correct device symbol is "cubie-a5e" — NOT "radxa_cubie-a5e".
          # DEVICE_VENDOR is just a display label in the .mk file, it is
          # not part of the Kconfig symbol. Confirmed against:
          # target/linux/sunxi/image/cortexa55.mk -> TARGET_DEVICES += cubie-a5e
          cat > .config << 'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa55=y
          CONFIG_TARGET_sunxi_cortexa55_DEVICE_cubie-a5e=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_luci-app-vnstat2=y

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y

          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y

          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_cloudflared=y
          CONFIG_PACKAGE_luci-app-cloudflared=y

          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y

          CONFIG_PACKAGE_iptables-mod-fullconenat=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          CONFIG_PACKAGE_kmod-nft-fullconenat=y

          CONFIG_KERNEL_TCP_CONG_BBR=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y

          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_iptables-mod-nat-extra=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y

          CONFIG_PACKAGE_libstdcpp=y
          CONFIG_PACKAGE_libpthread=y
          CONFIG_PACKAGE_librt=y
          CONFIG_PACKAGE_libev=y
          CONFIG_PACKAGE_libuv=y
          CONFIG_PACKAGE_libevent2=y
          CONFIG_PACKAGE_zlib=y
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libmbedtls=y
          CONFIG_PACKAGE_libnetfilter-conntrack=y
          CONFIG_PACKAGE_libnfnetlink=y
          CONFIG_PACKAGE_libmnl=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          EOF

          make defconfig

          # Fail loudly (not silently) if the symbol didn't take.
          if ! grep -q "^CONFIG_TARGET_sunxi_cortexa55_DEVICE_cubie-a5e=y" .config; then
            echo "ERROR: cubie-a5e device symbol missing after defconfig."
            echo "Devices actually available in this subtarget's .config template:"
            grep "DEVICE_" .config.old 2>/dev/null || true
            exit 1
          fi
          echo "Device symbol confirmed:"
          grep "DEVICE_cubie-a5e" .config

      - name: Download source files
        run: make download -j8

      - name: Compile Master Image
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload Flashable Image File
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_A5E_OpenWRT
          path: bin/targets/sunxi/cortexa55/*