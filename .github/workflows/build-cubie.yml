name: Build Radxa Cubie A5E OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Free runner disk space
      # ------------------------------------------------------------
      - name: Free up GitHub runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

          df -h

      # ------------------------------------------------------------
      # 2. Install build dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            quilt \
            cpio \
            bc \
            python3 \
            python3-distutils \
            python3-pip \
            libelf-dev \
            libdw-dev

      # ------------------------------------------------------------
      # 3. Checkout the A527 Cubie A5E development branch
      # ------------------------------------------------------------
      - name: Checkout sunxi A527 support branch
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: sunxi-a527-support
          fetch-depth: 1

      # ------------------------------------------------------------
      # 4. Update feeds
      # ------------------------------------------------------------
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # 5. Configure OpenWrt
      # ------------------------------------------------------------
      - name: Configure Cubie A5E
        run: |
          cat > .config <<'EOF'

          # ============================================================
          # TARGET
          # ============================================================

          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_armv82=y
          CONFIG_TARGET_sunxi_armv82_DEVICE_radxa_cubie-a5e=y

          # ============================================================
          # IMAGE / STORAGE
          # ============================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          # ============================================================
          # BUILD ALL PACKAGES
          # ============================================================

          # All userspace packages
          CONFIG_ALL=y

          # All kernel modules applicable to this build
          CONFIG_ALL_KMODS=y

          # All target-specific/non-shared packages
          CONFIG_ALL_NONSHARED=y

          # Useful for buildbot-style package generation
          CONFIG_DEVEL=y

          # ============================================================
          # LUCI
          # ============================================================

          CONFIG_PACKAGE_luci=y

          # ============================================================
          # VNSTAT
          # ============================================================

          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_luci-app-vnstat2=y

          # ============================================================
          # TERMINAL / FILE MANAGER / MONITORING
          # ============================================================

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_luci-app-filemanager=y

          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y

          # ============================================================
          # SQM
          # ============================================================

          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y

          # ============================================================
          # ADGUARD HOME
          # ============================================================

          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y

          # ============================================================
          # DOCKER
          # ============================================================

          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y

          CONFIG_KERNEL_CGROUPS=y

          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y

          # ============================================================
          # FULL CONE NAT
          # ============================================================

          CONFIG_PACKAGE_iptables-mod-fullconenat=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          CONFIG_PACKAGE_kmod-nft-fullconenat=y

          # ============================================================
          # PERFORMANCE
          # ============================================================

          CONFIG_KERNEL_TCP_CONG_BBR=y

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y

          # ============================================================
          # OPENSSL
          # ============================================================

          CONFIG_PACKAGE_libopenssl-armv8=y

          EOF

          echo "===== Initial configuration ====="
          cat .config

          make defconfig

          echo "===== Final configuration ====="
          grep -E \
            'CONFIG_TARGET_|CONFIG_ALL|CONFIG_PACKAGE_(luci|docker|adguard|sqm|vnstat|ttyd|nlbwmon|watchcat|irqbalance)' \
            .config || true

      # ------------------------------------------------------------
      # 6. Download every required source
      # ------------------------------------------------------------
      - name: Download sources
        run: |
          make download -j$(nproc) V=s

      # ------------------------------------------------------------
      # 7. Build toolchain first
      # ------------------------------------------------------------
      - name: Build tools
        run: |
          make tools/install -j$(nproc) V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) V=s

      # ------------------------------------------------------------
      # 8. Build target kernel and kernel modules
      # ------------------------------------------------------------
      - name: Build target kernel
        run: |
          make target/compile -j$(nproc) V=s

      # ------------------------------------------------------------
      # 9. Build ALL OpenWrt packages
      #
      # IGNORE_ERRORS=m:
      # Continue past packages that cannot be built on this target.
      #
      # This is important because CONFIG_ALL requests packages that
      # aren't necessarily buildable for every architecture/target.
      # ------------------------------------------------------------
      - name: Build all packages
        run: |
          make package/compile \
            -j$(nproc) \
            V=s \
            IGNORE_ERRORS=m

      # ------------------------------------------------------------
      # 10. Build/install packages and firmware
      # ------------------------------------------------------------
      - name: Build OpenWrt image
        run: |
          make \
            -j$(nproc) \
            V=s \
            IGNORE_ERRORS=m

      # ------------------------------------------------------------
      # 11. Generate package indexes
      # ------------------------------------------------------------
      - name: Generate package indexes
        run: |
          make package/index V=s

      # ------------------------------------------------------------
      # 12. Show build output
      # ------------------------------------------------------------
      - name: Show generated files
        run: |
          echo "===== TARGET OUTPUT ====="
          find bin/targets -type f -printf '%p %k KB\n' | sort || true

          echo
          echo "===== PACKAGE OUTPUT ====="
          find bin/packages -type f -printf '%p %k KB\n' | sort || true

          echo
          echo "===== ALL APK FILES ====="
          find bin -type f -name '*.apk' | sort || true

          echo
          echo "===== ALL IPK FILES ====="
          find bin -type f -name '*.ipk' | sort || true

      # ------------------------------------------------------------
      # 13. Prepare package archive
      # ------------------------------------------------------------
      - name: Prepare package archive
        run: |
          mkdir -p release/packages

          # Copy all generated binary packages
          find bin -type f \
            \( -name '*.apk' -o -name '*.ipk' \) \
            -exec cp -v {} release/packages/ \;

          # Copy package indexes
          find bin -type f \
            \( -name 'Packages' \
            -o -name 'Packages.gz' \
            -o -name 'Packages.sig' \) \
            -exec cp -v {} release/packages/ \; || true

          # Save the build configuration
          cp .config release/

          # Save feed information
          if [ -f feeds.conf ]; then
            cp feeds.conf release/
          fi

          if [ -f feeds.conf.default ]; then
            cp feeds.conf.default release/
          fi

          # Save git revision
          git rev-parse HEAD > release/openwrt-commit.txt
          git branch --show-current > release/openwrt-branch.txt

          # Package inventory
          find release/packages \
            -type f \
            \( -name '*.apk' -o -name '*.ipk' \) \
            | sort > release/package-list.txt

          echo "Package count:"
          wc -l release/package-list.txt

          echo "Package size:"
          du -sh release/packages

      # ------------------------------------------------------------
      # 14. Compress all packages
      # ------------------------------------------------------------
      - name: Compress package repository
        run: |
          tar -C release \
            -czf cubie-a5e-openwrt-packages.tar.gz \
            packages \
            .config \
            openwrt-commit.txt \
            openwrt-branch.txt \
            package-list.txt

          ls -lh cubie-a5e-openwrt-packages.tar.gz

      # ------------------------------------------------------------
      # 15. Create complete build archive
      # ------------------------------------------------------------
      - name: Create complete build archive
        run: |
          mkdir -p final

          # Firmware
          cp -a bin/targets/sunxi/armv82/* final/ 2>/dev/null || true

          # Package archive
          cp cubie-a5e-openwrt-packages.tar.gz final/

          # Configuration
          cp .config final/config.buildinfo

          echo "===== FINAL ARTIFACTS ====="
          ls -lah final

      # ------------------------------------------------------------
      # 16. Upload firmware
      # ------------------------------------------------------------
      - name: Upload Cubie A5E firmware
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_Firmware
          path: |
            bin/targets/sunxi/armv82/*
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 17. Upload ALL packages
      # ------------------------------------------------------------
      - name: Upload all packages
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_All_Packages
          path: cubie-a5e-openwrt-packages.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 18. Upload build configuration separately
      # ------------------------------------------------------------
      - name: Upload build configuration
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_Build_Config
          path: |
            .config
            feeds.conf*
          if-no-files-found: warn
          retention-days: 30
