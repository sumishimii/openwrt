name: Build Radxa Cubie A5E OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Free GitHub Actions runner disk space
      # ============================================================
      - name: Free up GitHub runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          sudo apt-get clean

          echo "Disk space after cleanup:"
          df -h


      # ============================================================
      # 2. Install OpenWrt build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            quilt \
            cpio \
            bc \
            libelf-dev \
            libdw-dev

          echo "Build dependencies installed."


      # ============================================================
      # 3. Checkout Wigyori's A527 support branch
      # ============================================================
      - name: Checkout sunxi A527 support branch
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: sunxi-a527-support
          fetch-depth: 1


      # ============================================================
      # 4. Display source revision
      # ============================================================
      - name: Show OpenWrt revision
        run: |
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Remote:"
          git remote -v


      # ============================================================
      # 5. Update and install feeds
      # ============================================================
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ============================================================
      # 6. Configure Cubie A5E
      # ============================================================
      - name: Configure Radxa Cubie A5E
        run: |

          cat > .config <<'EOF'

          # ==========================================================
          # TARGET
          # ==========================================================

          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_armv82=y
          CONFIG_TARGET_sunxi_armv82_DEVICE_radxa_cubie-a5e=y


          # ==========================================================
          # IMAGE STORAGE
          # ==========================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024


          # ==========================================================
          # BUILD ALL USERSpace PACKAGES
          # ==========================================================

          CONFIG_ALL=y

          # Explicitly enable all target-specific packages
          CONFIG_ALL_NONSHARED=y

          # Explicitly enable all buildable kernel modules
          CONFIG_ALL_KMODS=y

          # Enable build-system development options
          CONFIG_DEVEL=y


          # ==========================================================
          # LUCI
          # ==========================================================

          CONFIG_PACKAGE_luci=y


          # ==========================================================
          # VNSTAT
          # ==========================================================

          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_luci-app-vnstat2=y


          # ==========================================================
          # TERMINAL / FILE MANAGER
          # ==========================================================

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y


          # ==========================================================
          # NETWORK MONITORING
          # ==========================================================

          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y


          # ==========================================================
          # SQM / BUFFERBLOAT
          # ==========================================================

          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y


          # ==========================================================
          # ADGUARD HOME
          # ==========================================================

          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y


          # ==========================================================
          # DOCKER
          # ==========================================================

          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y

          CONFIG_KERNEL_CGROUPS=y

          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y


          # ==========================================================
          # FULL CONE NAT
          # ==========================================================

          CONFIG_PACKAGE_iptables-mod-fullconenat=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          CONFIG_PACKAGE_kmod-nft-fullconenat=y


          # ==========================================================
          # NETWORK / PERFORMANCE
          # ==========================================================

          CONFIG_KERNEL_TCP_CONG_BBR=y

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ==========================================================
          # OPENSSL
          # ==========================================================

          CONFIG_PACKAGE_libopenssl-armv8=y

          EOF


          echo "================================================"
          echo "Initial .config"
          echo "================================================"

          cat .config


          # Resolve dependencies and remove obsolete options.
          make defconfig


          echo
          echo "================================================"
          echo "Final .config target"
          echo "================================================"

          grep -E \
            'CONFIG_TARGET_|CONFIG_ALL|CONFIG_DEVEL' \
            .config || true


      # ============================================================
      # 7. Download all source archives
      # ============================================================
      - name: Download all sources
        run: |
          make download -j$(nproc) V=s


      # ============================================================
      # 8. Build OpenWrt
      #
      # world builds:
      #   toolchain
      #   kernel
      #   all selected packages
      #   firmware
      #
      # IGNORE_ERRORS=m allows packages which cannot be built for
      # this particular target to fail without killing the entire
      # build.
      # ============================================================
      - name: Build OpenWrt
        run: |
          make -j$(nproc) \
            world \
            V=s \
            IGNORE_ERRORS=m


      # ============================================================
      # 9. If parallel build fails, retry serially
      # ============================================================
      - name: Retry failed build serially
        if: failure()
        run: |
          echo "Parallel build failed."
          echo "Retrying with a single job..."

          make -j1 \
            world \
            V=s \
            IGNORE_ERRORS=m


      # ============================================================
      # 10. Display firmware output
      # ============================================================
      - name: Show firmware output
        run: |
          echo
          echo "================================================"
          echo "Firmware output"
          echo "================================================"

          find bin/targets/sunxi/armv82 \
            -maxdepth 2 \
            -type f \
            -printf '%p %k KB\n' \
            | sort || true


      # ============================================================
      # 11. Display all generated APK packages
      # ============================================================
      - name: Show APK packages
        run: |
          echo
          echo "================================================"
          echo "Generated APK packages"
          echo "================================================"

          find bin \
            -type f \
            -name '*.apk' \
            | sort > /tmp/apk-list.txt

          echo "APK package count:"
          wc -l /tmp/apk-list.txt

          echo
          echo "First packages:"
          head -50 /tmp/apk-list.txt

          echo
          echo "Total APK size:"
          du -ch $(cat /tmp/apk-list.txt) 2>/dev/null \
            | tail -1 || true


      # ============================================================
      # 12. Verify APK repositories
      # ============================================================
      - name: Inspect APK repositories
        run: |
          echo
          echo "================================================"
          echo "bin/packages"
          echo "================================================"

          find bin/packages \
            -maxdepth 4 \
            -type f \
            | sort || true

          echo
          echo "================================================"
          echo "Target packages"
          echo "================================================"

          find bin/targets/sunxi/armv82 \
            -type f \
            \( -name '*.apk' -o -name '*.adb' \) \
            | sort || true


      # ============================================================
      # 13. Create package repository archive
      #
      # IMPORTANT:
      #
      # We preserve bin/packages and target packages rather than
      # flattening everything into one directory.
      #
      # This keeps APK repository metadata and architecture/feed
      # structure intact.
      # ============================================================
      - name: Create complete APK package archive
        run: |

          mkdir -p release

          echo "Creating APK repository archive..."

          tar \
            -czf release/Radxa_Cubie_A5E_OpenWrt_All_APK_Packages.tar.gz \
            bin/packages \
            bin/targets/sunxi/armv82/packages

          echo
          echo "Package archive:"
          ls -lh \
            release/Radxa_Cubie_A5E_OpenWrt_All_APK_Packages.tar.gz


      # ============================================================
      # 14. Save build configuration
      # ============================================================
      - name: Save build information
        run: |

          cp .config \
            release/config.buildinfo

          git rev-parse HEAD \
            > release/openwrt-commit.txt

          git branch --show-current \
            > release/openwrt-branch.txt

          git log -1 --oneline \
            > release/openwrt-revision.txt


      # ============================================================
      # 15. Create package inventory
      # ============================================================
      - name: Create package inventory
        run: |

          find bin \
            -type f \
            -name '*.apk' \
            | sort \
            > release/all-apk-packages.txt

          echo "Total APK packages:"
          wc -l release/all-apk-packages.txt


      # ============================================================
      # 16. Create final firmware archive
      # ============================================================
      - name: Create firmware archive
        run: |

          tar \
            -czf release/Radxa_Cubie_A5E_OpenWrt_Firmware.tar.gz \
            -C bin/targets/sunxi/armv82 \
            .


      # ============================================================
      # 17. Upload firmware
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_Firmware
          path: |
            bin/targets/sunxi/armv82/*
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 18. Upload ALL APK packages
      # ============================================================
      - name: Upload all APK packages
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_All_APK_Packages
          path: |
            release/Radxa_Cubie_A5E_OpenWrt_All_APK_Packages.tar.gz
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. Upload build configuration
      # ============================================================
      - name: Upload build configuration
        uses: actions/upload-artifact@v4
        with:
          name: Radxa_Cubie_A5E_OpenWrt_Build_Config
          path: |
            release/config.buildinfo
            release/openwrt-commit.txt
            release/openwrt-branch.txt
            release/openwrt-revision.txt
            release/all-apk-packages.txt
          if-no-files-found: warn
          retention-days: 30
