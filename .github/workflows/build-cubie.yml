name: Build Ultimate Radxa Cubie A5E OpenWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up GitHub runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget quilt cpio libyaml-dev

      - name: Checkout Developer PR Branch Directly
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: sunxi-a527-support

      - name: Discover real sunxi target/device Kconfig symbols
        run: |
          echo "==== Subtargets defined in target/linux/sunxi/Makefile ===="
          grep -n "SUBTARGETS" target/linux/sunxi/Makefile || echo "not found"
          echo
          echo "==== All TARGET_sunxi_* symbols across Config.in files ===="
          grep -rn "config TARGET_sunxi_" target/linux/sunxi/ 2>/dev/null || echo "none found"
          echo
          echo "==== Anything mentioning cubie / a523 / a527 / armv82 ===="
          grep -rln -iE "cubie|a523|a527|armv82" target/linux/sunxi/ 2>/dev/null || echo "none found"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Master Configuration Settings
        run: |
          # 1. Base Machine Target Profiling & Storage Expansion
          echo "CONFIG_TARGET_sunxi=y" > .config
          echo "CONFIG_TARGET_sunxi_armv82=y" >> .config
          echo "CONFIG_TARGET_sunxi_armv82_DEVICE_radxa_cubie-a5e=y" >> .config

          # Force the compiler to increase storage allocation limits for Docker/AdGuard Home
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=64" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config

          # 2. Base Core Interfaces & Traffic Utilities
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_vnstat2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-vnstat2=y" >> .config

          # 3. Native Terminal, File Manager, Network Monitoring & Watchdog
          echo "CONFIG_PACKAGE_ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-filemanager=y" >> .config
          echo "CONFIG_PACKAGE_nlbwmon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-nlbwmon=y" >> .config
          echo "CONFIG_PACKAGE_watchcat=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-watchcat=y" >> .config

          # 4. Smart Queue Management (SQM) & Smart Bufferbloat Control
          echo "CONFIG_PACKAGE_sqm-scripts=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config

          # 5. Core Filtering AdGuard Home Integration Stack
          echo "CONFIG_PACKAGE_adguardhome=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config

          # 6. Integrate Complete Docker Container Stack Engine
          echo "CONFIG_PACKAGE_docker=y" >> .config
          echo "CONFIG_PACKAGE_dockerd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
          echo "CONFIG_KERNEL_CGROUPS=y" >> .config
          echo "CONFIG_PACKAGE_kmod-veth=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-btrfs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ipt-extra=y" >> .config

          # 7. Enable High Performance Full Cone NAT (NAT1)
          echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ipt-fullconenat=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-fullconenat=y" >> .config

          # 8. High Performance Optimizations (BBR TCP, Core Balancing & Crypto Acceleration)
          echo "CONFIG_KERNEL_TCP_CONG_BBR=y" >> .config
          echo "CONFIG_PACKAGE_irqbalance=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-irqbalance=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl-armv8=y" >> .config

          # 9. 464XLAT (CLAT) support for IPv6-only WAN / NAT64 uplinks
          echo "CONFIG_PACKAGE_464xlat=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nat46=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-ipv6=y" >> .config

          # 10. VLAN support (802.1q tagging + LuCI bridge VLAN filtering, DSA-based)
          echo "CONFIG_PACKAGE_kmod-8021q=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-network=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-vlan=y" >> .config

          make defconfig

      - name: Verify the correct target/device actually got selected
        run: |
          echo "==== Full sunxi TARGET/DEVICE lines in .config ===="
          grep -E "^CONFIG_TARGET_sunxi" .config || echo "none set!"
          echo
          if ! grep -q "^CONFIG_TARGET_sunxi_armv82=y" .config; then
            echo "::error::armv82 subtarget was NOT selected by defconfig — our .config symbol name is wrong. See the lines above for what actually got set, and the 'Discover real sunxi target/device Kconfig symbols' step output for the real symbol names."
            exit 1
          fi
          if ! grep -q "DEVICE_radxa_cubie-a5e=y" .config; then
            echo "::error::radxa_cubie-a5e device was NOT selected by defconfig. See the lines above for what actually got set."
            exit 1
          fi
          echo "Confirmed: armv82 subtarget + radxa_cubie-a5e device are selected."

      - name: Hardcode Local APK Feeds Out-of-the-box
        run: |
          mkdir -p files/etc/apk/repositories.d
          echo "https://openwrt.org" > files/etc/apk/repositories.d/distfeeds.list
          echo "https://openwrt.org" >> files/etc/apk/repositories.d/distfeeds.list
          echo "https://openwrt.org" >> files/etc/apk/repositories.d/distfeeds.list
          echo "https://openwrt.org" >> files/etc/apk/repositories.d/distfeeds.list

          mkdir -p files/etc/apk
          echo "aarch64_armv8.2-a" > files/etc/apk/arch
          echo "aarch64_generic" >> files/etc/apk/arch

      - name: Download source files
        run: make download -j8

      - name: Compile Master Image
        run: |
          # OpenWrt builds U-Boot's host dtc with PKG_CONFIG_LIBDIR forced to
          # staging_dir/host/lib/pkgconfig, so it never sees the system's
          # yaml-0.1.pc from libyaml-dev even though the library is installed.
          # NO_YAML=1 doesn't propagate into that sub-make either. The actual
          # fix is to make libyaml's .pc file visible where pkg-config is
          # really searching, so dtc's host tool correctly links -lyaml.
          mkdir -p staging_dir/host/lib/pkgconfig
          YAML_PC="$(dpkg -L libyaml-dev 2>/dev/null | grep 'pkgconfig/yaml-0\.1\.pc$' | head -n1)"
          if [ -n "$YAML_PC" ]; then
            cp "$YAML_PC" staging_dir/host/lib/pkgconfig/
            echo "Copied $YAML_PC -> staging_dir/host/lib/pkgconfig/"
          else
            echo "WARNING: yaml-0.1.pc not found from libyaml-dev; uboot-sunxi dtc build may still fail" >&2
          fi

          export NO_YAML=1
          make -j$(nproc) || make -j1 V=s

      - name: Show real build failure logs
        if: failure()
        run: |
          echo "==== Locating per-package failure logs ===="
          find logs -type f -name "*.txt" 2>/dev/null | while read -r f; do
            if grep -qiE "error|failed" "$f" 2>/dev/null; then
              echo "########## $f ##########"
              tail -n 200 "$f"
              echo
            fi
          done

      - name: Upload full build logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

      - name: List build output tree (debug)
        if: always()
        run: find bin/targets -maxdepth 3 2>/dev/null || echo "bin/targets does not exist"

      - name: Package all built ipk/apk packages for later manual install
        run: |
          PKG_DIR=$(find bin/targets -type d -name packages | head -n1)
          if [ -z "$PKG_DIR" ]; then
            echo "No packages directory found under bin/targets, skipping zip step"
            exit 0
          fi
          mkdir -p package-bundle
          cp -r "$PKG_DIR" package-bundle/packages
          # also grab the base/kernel/luci/routing/etc sub-feeds if they weren't nested under packages/
          find bin -maxdepth 4 -type d -iname 'packages' -exec cp -rn {} package-bundle/ \; 2>/dev/null || true
          cd package-bundle && zip -r ../all-packages.zip . && cd ..

      - name: Upload Ultimate Flashable Image File
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate_Radxa_A5E_OpenWRT
          # Path is wildcarded because the subtarget folder name under
          # bin/targets/sunxi/ has shifted before (cortexa53 -> armv82) and
          # a hardcoded path here silently uploads nothing if it's wrong
          # again, without failing the build.
          path: bin/targets/sunxi/*/*
          if-no-files-found: error

      - name: Upload All Core & Kernel Packages (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate_Radxa_A5E_OpenWRT_AllPackages
          path: all-packages.zip
